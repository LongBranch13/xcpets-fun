; XCPETS Pet Shell firmware (LilyGO T-Display-S3). Built by the GitHub workflow "petshell-firmware";
; players never build it: they flash it from https://xcpets.fun/shell/ in Chrome or Edge.
; Build by hand: pip install platformio && pio run -d petshell/firmware
[env:petshell]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  bblanchon/ArduinoJson@7.2.1
monitor_speed = 115200
