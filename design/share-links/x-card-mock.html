<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X card mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  body{margin:0;background:#000;color:#e7e9ea;font-family:ui-sans-serif,system-ui,sans-serif}
  .post{max-width:520px;margin:16px auto;padding:12px 16px}
  .who{display:flex;gap:10px;align-items:center}
  .av{width:40px;height:40px;border-radius:50%;background:#e11d2e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .name{font-weight:800}.handle{color:#71767b}
  .text{margin:10px 0 12px;font-size:16px;line-height:1.35}
  .card{border:1px solid #2f3336;border-radius:16px;overflow:hidden;background:#100E18}
  .card img{display:block;width:100%;height:auto}
  .meta{padding:10px 12px}
  .meta b{display:block;font-size:15px}
  .meta span{display:block;color:#71767b;font-size:14px;margin-top:2px}
  .dom{color:#71767b;font-size:13px;margin-bottom:2px}
</style>
</head>
<body>
<article class="post">
  <div class="who"><div class="av">X</div><div><div class="name">XCPETS</div><div class="handle">@XCPets</div></div></div>
  <p class="text">Miwa #15004 (Legendary Mythic) on XCPETS</p>
  <div class="card">
    <img src="../../pet/15004/card.png" alt="#15004 Miwa, Legendary Mythic" width="1200" height="630">
    <div class="meta">
      <div class="dom">xcpets.fun</div>
      <b>#15004 Miwa</b>
      <span>Legendary · Mythic · Nakamoto · owner bc1q…</span>
    </div>
  </div>
</article>
</body>
</html>
