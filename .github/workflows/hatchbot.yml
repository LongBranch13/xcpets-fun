# HatchBot announcer (Nov 22 2026). Each time the game feed (api/boot.json) lands on main, replay the game and post new cool events to Telegram.
# Why the push trigger: GitHub's own timer is best effort and on Nov 22 ran this every-10-minutes job only twice in 10 hours,
# so the bot went quiet. The feed server pushes api/boot.json every ~20-25 min and new events can only appear then.
# The timer stays as a backup.
# Run it by hand with a message to post a game update ("Post update"): Actions > hatchbot > Run workflow > type the update.
# Or type yes in 'recap' to repost yesterday's daily recap (hatchbot/post-recap.mjs).
# Or fill 'update' with the name of a prepared series in hatchbot/updates/ to post it with its pet pictures.
# Posts carry pet pictures and short GIFs drawn by hatchbot/art.js (the site's own renderer); any drawing problem falls back to text.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. Until both are set this job does nothing.
# Memory of what was posted lives on the hatchbot-state branch (not main), so it never triggers a site deploy.
name: hatchbot
on:
  push:
    branches: [main]
    paths: ['api/boot.json']
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      message:
        description: 'Game update to post in Telegram (leave empty to just check for new events)'
        required: false
        default: ''
      update:
        description: 'Or post a prepared update series with pet pictures: the name of a file in hatchbot/updates (e.g. nov23-whats-new)'
        required: false
        default: ''
      recap:
        description: "Or type yes to repost yesterday's daily recap now (it also posts by itself every morning at 8 AM Central)"
        required: false
        default: ''
permissions: { contents: write, issues: write }
concurrency: { group: hatchbot, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPDATE: ${{ github.event.inputs.message }}
      SERIES: ${{ github.event.inputs.update }}
      RECAP: ${{ github.event.inputs.recap }}
    steps:
      - name: Check setup
        id: ready
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "::notice::HatchBot is not set up yet (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets). Nothing posted."; echo "go=" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
        with: { ref: main, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go
        with: { node-version: '20' }
      - name: Bug reports to GitHub issues
        if: steps.ready.outputs.go && env.UPDATE == '' && env.SERIES == '' && env.RECAP == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node hatchbot/bugs-to-issues.js
      - name: Post game update
        if: steps.ready.outputs.go && env.UPDATE != ''
        run: node hatchbot/announce.js --post "$UPDATE"
      - name: Post prepared update series (with pet pictures)
        if: steps.ready.outputs.go && env.UPDATE == '' && env.SERIES != ''
        run: node --max-old-space-size=6000 hatchbot/announce.js --update "$SERIES"
      - name: Repost the daily recap
        if: steps.ready.outputs.go && env.UPDATE == '' && env.SERIES == '' && env.RECAP == 'yes'
        run: node --max-old-space-size=6000 hatchbot/post-recap.mjs
      - name: Load memory
        if: steps.ready.outputs.go && env.UPDATE == '' && env.SERIES == '' && env.RECAP == ''
        run: |
          mkdir -p state
          if git fetch --depth 1 origin hatchbot-state 2>/dev/null; then git show FETCH_HEAD:state.json > state/state.json || rm -f state/state.json; fi
      - name: Announce new events
        if: steps.ready.outputs.go && env.UPDATE == '' && env.SERIES == '' && env.RECAP == ''
        run: node --max-old-space-size=6000 hatchbot/announce.js --state state/state.json --pics pics
      - name: Publish pet pictures for the Cloudflare bot (branch hatchbot-art, never main)
        if: always() && steps.ready.outputs.go && env.UPDATE == '' && env.SERIES == '' && env.RECAP == ''
        run: |
          [ -f pics/index.json ] || exit 0
          cd pics && git init -q && git checkout -q -b hatchbot-art
          git config user.name "hatchbot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "hatchbot pet pictures $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hatchbot-art
      - name: Save memory
        # always(): also after a crash, hang or timeout, so what was already posted is never posted again
        if: always() && steps.ready.outputs.go && env.UPDATE == '' && env.SERIES == '' && env.RECAP == ''
        run: |
          [ -f state/state.json ] || exit 0
          cd state && git init -q && git checkout -q -b hatchbot-state
          git config user.name "hatchbot"; git config user.email "actions@users.noreply.github.com"
          git add state.json && git commit -q -m "hatchbot memory $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hatchbot-state
