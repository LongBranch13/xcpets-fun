# pages-feed (Nov 9 2026). The built-in branch deploy (pages-build-deployment) calls actions/deploy-pages
# with timeout 600000. On Nov 9 the feed commit for block 975218 stayed in syncing_files until that cap,
# then the action aborted and cancelled the deployment. A retry did the same, so xcpets.fun kept the previous feed.
# This workflow publishes only after Settings → Pages → Source is GitHub Actions (build_type workflow).
# Until then it does nothing, so it does not race the branch deploy. Once it is the publisher it:
#   - omits previews/ (design screenshots, ~24MB of the ~47MB compressed artifact, not used by any page)
#   - packs api/pets.json to columnar v2 if the committed file is still the old object list
#   - asks deploy-pages for 30 minutes. actions/deploy-pages@v5 clamps any larger value to 600000 ms (10 minutes)
#     and prints that warning. A newer push waits (cancel-in-progress: false) instead of cancelling the sync.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
# Not the built-in "pages" group: that one is the branch deploy. Sharing it would queue feed publishes behind this check.
concurrency:
  group: pages-actions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: See how this repo publishes
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "build_type=$bt"
          echo "type=$bt" >> "$GITHUB_OUTPUT"
          echo "Pages build_type: $bt" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage the site without design previews
        if: steps.src.outputs.type == 'workflow'
        run: |
          mkdir -p _site
          rsync -a --exclude _site --exclude .git --exclude previews --exclude node_modules ./ _site/
          node tools/pets-pack.js --compact _site/api/pets.json
          echo "staged $(du -sb _site | awk '{print $1}') bytes, pets.json $(wc -c < _site/api/pets.json) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      # Never go dark (Nov 22 2026): when this push changes the rules, wait (up to 20 minutes) until the game server has built a
      # world for the new rules, so players never land on rules the server has no fast world for. Immediate when the rules did
      # not change; skipped when the server does not follow main yet or does not answer. Never fails the deploy.
      - name: Wait for the server's world for these rules
        if: steps.src.outputs.type == 'workflow'
        continue-on-error: true
        timeout-minutes: 22
        run: node tools/worldwatch.js --wait-for-rsig "$(node tools/worldwatch.js --rsig-of-checkout)" --wait 20
      - uses: actions/upload-pages-artifact@v3
        if: steps.src.outputs.type == 'workflow'
        with: { path: _site }
      # Nov 22 2026: deploy-pages sometimes answers 'No artifacts named github-pages were found' right after a
      # successful upload (4 times that day). The site then kept the previous push until the next one. Try again
      # once after a short wait instead of leaving a fix unpublished.
      - id: deploy1
        if: steps.src.outputs.type == 'workflow'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with: { timeout: 1800000 }
      - name: Wait before the second try
        if: steps.src.outputs.type == 'workflow' && steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.src.outputs.type == 'workflow' && steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with: { timeout: 1800000 }
      - name: Branch deploy still publishes this push
        if: steps.src.outputs.type != 'workflow'
        run: echo "::notice::Pages source is '${{ steps.src.outputs.type }}', so this workflow did not upload a second copy. Set Settings → Pages → Source to GitHub Actions after this file is on main. Feed publishes then use a 30 minute sync budget, omit previews/, and ship the compact pets.json."
