# Server restart (Nov 22 2026, owner: "I want you to be able to restart server"). Reboots the game's Hetzner server through the
# Hetzner Cloud API, then waits until node.xcpets.fun/xp/v1/health answers again and prints its public numbers.
# Needs the repository secret HCLOUD_TOKEN (a Hetzner Cloud API token, Read & Write). Prints no IP addresses or server details:
# only the server's status word and the public health numbers. Runs only by hand (Actions tab > server-restart > Run workflow).
name: server-restart
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type RESTART to reboot the game server (about 1-3 minutes offline)', required: true, default: '' }
      mode: { description: 'reboot = soft restart (normal). reset = hard power reset (only if reboot does not help)', type: choice, options: [reboot, reset], default: reboot }
permissions: { contents: read }
concurrency: { group: server-restart, cancel-in-progress: false }
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check
        env: { CONFIRM: '${{ github.event.inputs.confirm }}', HCLOUD_TOKEN: '${{ secrets.HCLOUD_TOKEN }}' }
        run: |
          [ "$CONFIRM" = "RESTART" ] || { echo "Type RESTART in the confirm box to run this."; exit 1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "The HCLOUD_TOKEN secret is missing (Settings > Secrets and variables > Actions)."; exit 1; }
      - name: Health before
        run: node -e "fetch('https://node.xcpets.fun/xp/v1/health?cb='+Date.now()).then(r=>r.json()).then(h=>{delete h.upstream;console.log('before',JSON.stringify(h))}).catch(e=>console.log('health not answering:',e.message))"
      - name: Reboot through the Hetzner API
        env: { HCLOUD_TOKEN: '${{ secrets.HCLOUD_TOKEN }}', MODE: '${{ github.event.inputs.mode }}' }
        run: |
          node -e "
            const H = { Authorization: 'Bearer ' + process.env.HCLOUD_TOKEN, 'Content-Type': 'application/json' }, api = 'https://api.hetzner.cloud/v1';
            (async () => {
              const r = await fetch(api + '/servers?per_page=50', { headers: H }); if (!r.ok) throw new Error('Hetzner API answered ' + r.status + ' (check the token)');
              const all = (await r.json()).servers || [];
              /* the game server: the one whose public IPv4 node.xcpets.fun resolves to (compared here, never printed) */
              const dns = require('dns').promises; let ips = []; try { ips = await dns.resolve4('node.xcpets.fun'); } catch (e) {}
              let s = all.filter(x => x.public_net && x.public_net.ipv4 && ips.includes(x.public_net.ipv4.ip));
              if (!s.length && all.length === 1) s = all;
              if (s.length !== 1) throw new Error('Could not tell which server is the game server (' + all.length + ' servers in this project). Nothing was restarted.');
              const sv = s[0], act = process.env.MODE === 'reset' ? 'reset' : 'reboot';
              console.log('server status before:', sv.status);
              const a = await fetch(api + '/servers/' + sv.id + '/actions/' + act, { method: 'POST', headers: H });
              if (!a.ok) throw new Error('Hetzner API refused the ' + act + ' (' + a.status + ')');
              const act0 = (await a.json()).action; console.log(act + ' sent, action status:', act0 && act0.status);
            })().catch(e => { console.error(e.message); process.exit(1); });"
      - name: Wait for the game server to answer again
        run: |
          sleep 45
          node -e "
            const t0 = Date.now(); (async function loop() {
              try { const h = await (await fetch('https://node.xcpets.fun/xp/v1/health?cb=' + Date.now())).json(); delete h.upstream;
                if (h.tip) { console.log('back after ' + Math.round((Date.now() - t0) / 1000 + 45) + ' s:', JSON.stringify(h)); return; } } catch (e) {}
              if (Date.now() - t0 > 12 * 60000) { console.log('The server did not answer within 13 minutes. The service may not start on its own after a reboot.'); process.exit(1); }
              setTimeout(loop, 15000); })();"
