# Follow probe (Nov 24 2026): one follow step of the sync server from api/boot.json to the chain tip, against the public Counterparty
# API, printing which step fails and why. Read-only. Runs by hand and when the probe changes on a branch.
name: followprobe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/followprobe.yml', 'tools/followprobe.js']
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: One follow step
        run: node tools/followprobe.js
