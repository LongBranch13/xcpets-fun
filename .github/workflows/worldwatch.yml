# World watch (Nov 22 2026). Checks that players get the fast load: the server has a fresh world for the rules the live site runs.
# Runs every 15 minutes, after every site deploy (it then keeps checking for up to 25 minutes while the new world builds), and by hand.
# On a problem it opens one GitHub issue labelled world-alert (or comments on the open one, at most every 2 hours) and, when the
# TELEGRAM_ALERT_CHAT_ID secret is set, HatchBot sends the alert to that chat. When things are fine again it closes the issue and says so.
# Reads only public URLs. Nothing is changed on the server.
name: worldwatch
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_run:
    workflows: [pages]
    types: [completed]
  workflow_dispatch: {}
permissions: { contents: read, issues: write, actions: write }
# After-deploy runs wait up to 25 minutes; they get their own group (a newer deploy replaces the wait) so they never hold up the
# 15-minute checks or a run by hand.
concurrency: { group: "worldwatch-${{ github.event_name == 'workflow_run' && 'deploy' || 'check' }}", cancel-in-progress: "${{ github.event_name == 'workflow_run' }}" }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Check the live site and the published world
        id: check
        env: { WAIT: "${{ github.event_name == 'workflow_run' && '25' || '0' }}" }
        run: |
          set +e
          node tools/worldwatch.js --wait "$WAIT" --json "$RUNNER_TEMP/ww.json"
          echo "bad=$?" >> "$GITHUB_OUTPUT"
      - name: Alert or all clear
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          BAD: ${{ steps.check.outputs.bad }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/worldwatch-alert.js "$RUNNER_TEMP/ww.json"
      # A rules deploy held back by pages.yml (no world yet for the new rules): once the server has that world, publish it.
      - name: Re-run a held rules deploy once its world exists
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          [ -f "$RUNNER_TEMP/ww.json" ] || exit 0
          READY=$(node -e "const r=require(process.argv[1]);console.log(r.liveRsig&&r.mainRsig&&r.liveRsig!==r.mainRsig&&r.mainWorldTip?1:0)" "$RUNNER_TEMP/ww.json")
          [ "$READY" = "1" ] || exit 0
          BUSY=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --limit 5 --json status --jq '[.[]|select(.status!="completed")]|length')
          if [ "${BUSY:-0}" != "0" ]; then echo "A pages deploy is already running."; exit 0; fi
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main && echo "The world for main's rules exists: re-running the held deploy." | tee -a "$GITHUB_STEP_SUMMARY"
