# Node probe (Nov 22 2026): is the published world keeping up? Prints only public numbers from node.xcpets.fun's health and latest.json
# (tips, lags, build time). Runs by hand and when this file changes on a branch.
name: nodeprobe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/nodeprobe.yml']
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health and latest world
        run: |
          for i in 1 2 3; do
            node -e "
              const get = u => fetch(u + '?cb=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
              Promise.all([get('https://node.xcpets.fun/xp/v1/health'), get('https://node.xcpets.fun/xp/v1/world/latest.json'), get('https://xcpets.fun/api/meta.json').catch(() => ({}))]).then(([h, l, m]) => {
                const pick = o => Object.fromEntries(Object.entries(o).filter(([k, v]) => typeof v === 'number' || typeof v === 'boolean' || v === null || /At$|^rsig$|^v$/.test(k)));
                console.log(new Date().toISOString(), JSON.stringify({ health: pick(h), check: h.check || null, mem: h.mem || null, latest: pick(l), feedTip: m.blockHeight || m.tip || null }));
              }).catch(e => console.log('probe failed:', e.message));"
            sleep 20
          done
      - name: Burn check and Spam City answers
        run: |
          node -e "
            const B = 'https://node.xcpets.fun';
            (async () => {
              let t = Date.now(); const c = await fetch(B + '/xp/v1/check', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ plans: [{ tag: 'pet:feed:1' }], me: '', pending: [] }) }).then(r => r.json()).catch(e => ({ error: e.message }));
              console.log('check', (Date.now() - t) + ' ms', JSON.stringify({ ok: c.ok, tip: c.tip, rsig: c.rsig, skip: c.skip, error: c.error }));
              t = Date.now(); const s = await fetch(B + '/xp/v1/shop?cb=' + Date.now()).then(r => r.json()).catch(e => ({ error: e.message }));
              console.log('shop', (Date.now() - t) + ' ms', JSON.stringify({ ok: s.ok, tip: s.tip, rsig: s.rsig, listings: (s.listings || []).length, pets: (s.pets || []).length, orders: (s.orders || []).length, open: s.open, error: s.error }));
            })();"
      - name: Spam City shelves (published shop pack) and live files
        run: |
          node -e "
            const B = 'https://node.xcpets.fun', get = u => fetch(u + (u.includes('?') ? '&' : '?') + 'cb=' + Date.now(), { cache: 'no-store' });
            const md5 = t => require('crypto').createHash('md5').update(t).digest('hex');
            (async () => {
              const l = await (await get(B + '/xp/v1/world/latest.json')).json(); const dir = l.manifest.replace(/manifest\\.json$/, '');
              const m = await (await get(B + l.manifest)).json();
              const r = await get(B + dir + 'view/p/99901.json'); const j = r.ok ? await r.json() : null;
              console.log('latest tip', l.tip, 'rsig', l.rsig, 'manifest view.shop', m.view && m.view.shop);
              console.log('shop pack', r.status, j ? JSON.stringify({ ok: j.ok, tip: j.tip, rsigMatch: j.rsig === l.rsig, listings: j.listings.length, pets: j.pets.length, orders: j.orders.length, open: j.open }) : 'missing');
              for (const f of ['js/v2-sales.js', 'js/v2-split.js', 'js/v2-shop-scene.js', 'shop.html']) {
                const live = await (await get('https://xcpets.fun/' + f)).text(), main = await (await get('https://raw.githubusercontent.com/LongBranch13/xcpets-fun/main/' + f)).text();
                console.log(f, md5(live) === md5(main) ? 'SAME' : 'DIFF', md5(live));
              }
            })().catch(e => console.log('shelves probe failed:', e.message));"
      - name: Raids in the slim view
        run: |
          node -e "
            const B = 'https://node.xcpets.fun', get = u => fetch(u + '?cb=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
            get(B + '/xp/v1/world/latest.json').then(l => get(B + l.manifest.replace(/manifest\.json$/, '') + 'view/summary.json')).then(s => {
              const R = s.raids;
              console.log('summary tip', s.tip, 'rsig', s.rsig, Array.isArray(R) ? R.length + ' raids' : 'NO raids key');
              (R || []).forEach(r => console.log(' raid', r.n, 'open', r.open, 'end', r.end, 'boss', r.boss, 'hp', r.left + '/' + r.hp, 'hits', (r.hits || []).length, r.settled ? 'settled ' + r.result : 'live'));
            }).catch(e => console.log('raids probe failed:', e.message));"
      - name: Part churn between the last builds
        run: |
          node -e "
            const B = 'https://node.xcpets.fun', get = u => fetch(u + '?cb=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
            (async () => {
              const l = await get(B + '/xp/v1/world/latest.json'); const tip = l.tip, rs = l.rsig, mans = [];
              for (let t = tip; t > tip - 40 && mans.length < 4; t--) { const m = await get(B + '/xp/v1/world/' + rs + '/' + t + '/manifest.json').catch(() => null); if (m && m.checkpoint) mans.push([t, m]); }
              const sh = m => { const c = m.checkpoint, o = new Map(); (c.files || []).forEach(f => o.set(f.sha256, f.bytes || 0)); return o; };
              const all = m => (m.checkpoint.files || []).reduce((s, f) => s + (f.bytes || 0), 0);
              console.log('builds found', mans.map(x => x[0]).join(', '));
              for (let i = 1; i < mans.length; i++) { const a = sh(mans[i][1]), b = sh(mans[0][1]); let same = 0, sameB = 0; for (const [h, n] of b) if (a.has(h)) { same++; sameB += n; }
                console.log('tip', mans[0][0], 'vs', mans[i][0], ':', same, 'of', b.size, 'parts unchanged,', (sameB / 1e6).toFixed(1), 'of', (all(mans[0][1]) / 1e6).toFixed(1), 'MB'); }
              const f0 = (mans[0][1].checkpoint.files || []).slice(0, 3).map(f => f.url + ' ' + f.bytes).join(' | '); console.log('sample', f0);
            })().catch(e => console.log('churn probe failed:', e.message));"
