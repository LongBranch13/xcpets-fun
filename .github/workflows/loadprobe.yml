# Load probe (Nov 22 2026): how fast each page opens for real wallets on the live site, and what it downloads.
# View-only, nothing signed. Results: the run summary. Runs by hand, and when tools/loadprobe changes on a branch. On a branch it also measures
# the branch's own pages and scripts against live data (--branch), next to the live site. It also records freezes (long tasks), blank pet pictures
# while scrolling My Pets, a CPU profile, and a run with the server world blocked (the in-browser rebuild that froze My Pets on Nov 22 2026).
name: loadprobe
on:
  workflow_dispatch:
    inputs:
      wallets: { description: 'Comma-separated wallets (empty = Evan, owner, a test wallet)', required: false, default: '' }
      pages: { description: 'Comma-separated pages', required: false, default: 'play.html,breed.html,cemetery.html' }
      slow: { description: 'Also run on a phone network with a slower CPU', type: boolean, default: true }
      noworld: { description: 'Also run with the server world blocked (the page rebuilds the game itself, like during a server rebuild)', type: boolean, default: true }
  push:
    paths: ['tools/loadprobe/**', '.github/workflows/loadprobe.yml']
permissions: { contents: read }
concurrency: { group: loadprobe, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save --no-package-lock playwright-core@1
      - name: Fast network
        env: { WALLETS: '${{ github.event.inputs.wallets }}', PAGES: '${{ github.event.inputs.pages }}', BRANCH_FLAG: "${{ github.ref != 'refs/heads/main' && '--branch' || '' }}" }
        run: node tools/loadprobe/run.js --profile --scroll ${BRANCH_FLAG} ${WALLETS:+--wallets "$WALLETS"} --pages "${PAGES:-play.html,breed.html}"
      - name: Server world blocked (in-browser rebuild)
        if: always() && (github.event_name == 'push' || github.event.inputs.noworld == 'true')
        env: { WALLETS: '${{ github.event.inputs.wallets }}', BRANCH_FLAG: "${{ github.ref != 'refs/heads/main' && '--branch' || '' }}" }
        run: node tools/loadprobe/run.js --no-world --profile --scroll --max-wait 300 ${BRANCH_FLAG} --pages play.html --wallets "${WALLETS:-bc1pfvkpmllr7mtn5uazqxumwp39h2ny3c8l6fmrgvjv2cqn5wlpt7hssf3gqd,bc1pd8pantl2vmvdf5uvtvvn0r3xnnuxvp0wln8xmlxqmykxfnte3mwqmes2ut}"
      - name: Phone network, slower CPU
        if: always() && (github.event_name == 'push' || github.event.inputs.slow == 'true')
        env: { WALLETS: '${{ github.event.inputs.wallets }}', BRANCH_FLAG: "${{ github.ref != 'refs/heads/main' && '--branch' || '' }}" }
        run: node tools/loadprobe/run.js --slow --profile --scroll ${BRANCH_FLAG} --pages play.html --wallets "${WALLETS:-bc1pfvkpmllr7mtn5uazqxumwp39h2ny3c8l6fmrgvjv2cqn5wlpt7hssf3gqd}"
