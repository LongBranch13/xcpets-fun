# Server repair / update (Nov 22 2026). The published world stopped at 977,059 and a reboot did not fix it: the server runs
# the sync-server code from before PR #98, which keeps failing the same build. This workflow reaches the disk without any
# login on the server, using only the HCLOUD_TOKEN secret:
#   1. makes a one-time SSH key on the runner and hands its public half to Hetzner,
#   2. boots the server into Hetzner's rescue system with that key and mounts the server's disk,
#   3. prints a short diagnosis (free disk, leftover build folders, builder error lines with any address scrubbed),
#   4. removes leftover pending-<tip> build folders and installs tools/sync-server/*.js from main (old copy kept beside it),
#   5. boots the server normally, deletes the one-time key from Hetzner, and waits for a new published world.
# No key stays behind, nothing is printed about the server's address (it is masked) or its settings.
# Runs only by hand: Actions tab > server-repair > Run workflow, type REPAIR. About 5 minutes offline.
name: server-repair
on:
  workflow_dispatch:
    inputs:
      confirm: { description: 'Type REPAIR to boot the game server into rescue mode, update its sync-server code and boot it again', required: true, default: '' }
      update_code: { description: 'Install tools/sync-server from main (off = only diagnose and clear leftover build folders)', type: boolean, default: true }
      diagnose_only: { description: 'Only look: print the diagnosis and change nothing on the disk', type: boolean, default: false }
      sync_rules: { description: 'Install the 12 rule files from main (the rsig files) and rebuild the world if its rsig differs from main', type: boolean, default: false }
      enable_builder: { description: 'Turn the world builder in the sync service back on (XP_SNAPSHOT=0 becomes 1; a .bak copy is kept)', type: boolean, default: false }
      sync_memory: { description: 'Size the sync service for the 8 GB server: MemoryHigh 5000M / MemoryMax 5600M and a 3.5 GB JavaScript heap (a drop-in file; delete it to undo)', type: boolean, default: false }
      node_watchdog: { description: 'Install the node cache watchdog (restarts the cache when it stops answering) and let the sync service restart itself', type: boolean, default: false }
      sync_watchdog: { description: 'Install the game server watchdog (restarts the sync service when it stops answering or its follow step is stuck) and a time limit on the feed job', type: boolean, default: true }
permissions: { contents: read }
concurrency: { group: server-restart, cancel-in-progress: false }
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: { HCLOUD_TOKEN: '${{ secrets.HCLOUD_TOKEN }}' }
    steps:
      - name: Check
        env: { CONFIRM: '${{ github.event.inputs.confirm }}' }
        run: |
          [ "$CONFIRM" = "REPAIR" ] || { echo "Type REPAIR in the confirm box to run this."; exit 1; }
          [ -n "$HCLOUD_TOKEN" ] || { echo "The HCLOUD_TOKEN secret is missing (Settings > Secrets and variables > Actions)."; exit 1; }
      - uses: actions/checkout@v4
        with: { ref: main, path: src }
      - name: Health before
        run: node -e "fetch('https://node.xcpets.fun/xp/v1/health?cb='+Date.now()).then(r=>r.json()).then(h=>{delete h.upstream;console.log('before',JSON.stringify(h))}).catch(e=>console.log('health not answering:',e.message))"
      - name: One-time key, rescue boot
        run: |
          ssh-keygen -q -t ed25519 -N '' -C repair-$GITHUB_RUN_ID -f "$RUNNER_TEMP/k"
          node -e "
            const fs = require('fs'), H = { Authorization: 'Bearer ' + process.env.HCLOUD_TOKEN, 'Content-Type': 'application/json' }, api = 'https://api.hetzner.cloud/v1';
            const call = async (p, o) => { const r = await fetch(api + p, Object.assign({ headers: H }, o)); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(p.split('/').slice(0, 3).join('/') + ' answered ' + r.status + ' ' + ((j.error && j.error.code) || '')); return j; };
            const wait = async id => { for (let i = 0; i < 60; i++) { const a = (await call('/actions/' + id)).action; if (a.status !== 'running') { if (a.status !== 'success') throw new Error('action ' + a.command + ' ' + a.status); return; } await new Promise(r => setTimeout(r, 3000)); } throw new Error('action timed out'); };
            (async () => {
              const all = (await call('/servers?per_page=50')).servers || [];
              let ips = []; try { ips = await require('dns').promises.resolve4('node.xcpets.fun'); } catch (e) {}
              let s = all.filter(x => x.public_net && x.public_net.ipv4 && ips.includes(x.public_net.ipv4.ip)); if (!s.length && all.length === 1) s = all;
              if (s.length !== 1) throw new Error('Could not tell which server is the game server. Nothing was changed.');
              const sv = s[0], ip = sv.public_net.ipv4.ip;
              const key = (await call('/ssh_keys', { method: 'POST', body: JSON.stringify({ name: 'xcpets-repair-' + process.env.GITHUB_RUN_ID, public_key: fs.readFileSync(process.env.RUNNER_TEMP + '/k.pub', 'utf8').trim() }) })).ssh_key;
              fs.appendFileSync(process.env.GITHUB_ENV, 'SV=' + sv.id + '\nKEYID=' + key.id + '\nIP=' + ip + '\n');
              console.log('::add-mask::' + ip);
              await wait((await call('/servers/' + sv.id + '/actions/enable_rescue', { method: 'POST', body: JSON.stringify({ type: 'linux64', ssh_keys: [key.id] }) })).action.id);
              await wait((await call('/servers/' + sv.id + '/actions/reboot', { method: 'POST' })).action.id);
              console.log('rescue boot started (server was ' + sv.status + ')');
            })().catch(e => { console.error(e.message); process.exit(1); });"
      - name: Wait for the rescue system
        run: |
          echo "::add-mask::$IP"
          for i in $(seq 1 60); do
            if ssh -i "$RUNNER_TEMP/k" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o LogLevel=ERROR root@"$IP" true >/dev/null 2>&1; then echo "rescue system answers after $((i*10)) s"; exit 0; fi
            sleep 10
          done
          echo "The rescue system did not answer within 10 minutes."; exit 1
      - name: Diagnose and repair
        env: { UPDATE: '${{ github.event.inputs.update_code }}', LOOK: '${{ github.event.inputs.diagnose_only }}', BUILD: '${{ github.event.inputs.enable_builder }}', RULES: '${{ github.event.inputs.sync_rules }}', DOG: '${{ github.event.inputs.node_watchdog }}', SDOG: '${{ github.event.inputs.sync_watchdog }}', SMEM: '${{ github.event.inputs.sync_memory }}' }
        run: |
          echo "::add-mask::$IP"
          S="ssh -i $RUNNER_TEMP/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR root@$IP"
          tar -C src -czf "$RUNNER_TEMP/ss.tgz" tools/sync-server tools/lib js/v2-boot-sync.js js/v2-chain.js js/block-hashes.js js/v2-grave-index.js hatchbot/art.js $(cd src && ls js/*-sprite.js) js/v2-bg.js js/v2-looks.js js/v2-clown-hair.js js/v2-render.js
          RF="rjs/config.js rjs/pet-core.js rjs/game-core.js rjs/bonus-gear.js rjs/real-core.js rjs/chain.js js/pet-core.js js/bonus-gear.js js/v2-gear.js js/v2-fit.js js/v2-rules.js js/v2-replay-worker.js"
          tar -C src -czf "$RUNNER_TEMP/rules.tgz" $RF
          MAINRSIG=$(cd src && node -e "const fs=require('fs'),c=require('crypto');const bs=process.argv.slice(1).map(f=>fs.readFileSync(f));let n=0;bs.forEach(b=>n+=b.length+8);const a=Buffer.alloc(n);let o=0;bs.forEach(b=>{a.writeUInt32BE(b.length,o);o+=8;b.copy(a,o);o+=b.length});console.log('r'+c.createHash('sha256').update(a).digest('hex').slice(0,32))" $RF)
          echo "main rsig: $MAINRSIG"
          scp -i "$RUNNER_TEMP/k" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR "$RUNNER_TEMP/rules.tgz" root@"$IP":/root/rules.tgz
          scp -i "$RUNNER_TEMP/k" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR "$RUNNER_TEMP/ss.tgz" root@"$IP":/root/ss.tgz
          $S "UPDATE=$UPDATE LOOK=$LOOK BUILD=$BUILD RULES=$RULES DOG=$DOG SDOG=${SDOG:-true} SMEM=$SMEM MAINRSIG=$MAINRSIG bash -s" <<'EOS'
          set -u
          scrub() { sed -E 's/[A-Za-z0-9.-]*\.(sslip|nip|xip)\.io/<host>/g; s/[0-9]{1,3}(-[0-9]{1,3}){3}/<ip>/g; s/[a-z2-7]{16,56}\.onion/<onion>/g; s/[0-9]{1,3}(\.[0-9]{1,3}){3}/<ip>/g; s#[a-z]+://[^ ]+#<url>#g; s/[0-9a-f]{0,4}(:[0-9a-f]{0,4}){3,7}/<ip6>/g'; }
          # the server's disk: the biggest ext4/xfs partition
          DEV=$(lsblk -lnpbo NAME,FSTYPE,SIZE | awk '$2=="ext4"||$2=="xfs"{print $3, $1}' | sort -n | tail -1 | cut -d' ' -f2)
          [ -n "$DEV" ] || { echo "no disk partition found"; exit 1; }
          mkdir -p /mnt/r && mount "$DEV" /mnt/r || { echo "mount failed"; exit 1; }
          echo "disk: $(df -m /mnt/r | awk 'NR==2{print $4" MB free of "$2" MB ("$5" used)"}')"
          UNIT=$(find /mnt/r/etc/systemd/system /mnt/r/lib/systemd/system /mnt/r/usr/lib/systemd/system -maxdepth 1 -name 'xcpets-sync.service' 2>/dev/null | head -1)
          [ -n "$UNIT" ] || { echo "service file xcpets-sync.service not found"; exit 1; }
          ENVF=$(grep -h '^EnvironmentFile=' "$UNIT" | head -1 | cut -d= -f2- | sed 's/^-//')
          ALL="$(cat "$UNIT"; [ -n "$ENVF" ] && cat "/mnt/r$ENVF" 2>/dev/null)"
          DATA=$(printf '%s\n' "$ALL" | grep -oE 'XP_DATA=[^ "]+' | head -1 | cut -d= -f2-); [ -n "$DATA" ] || DATA=/tmp/xcpets-sync
          WD=$(printf '%s\n' "$ALL" | grep -m1 '^WorkingDirectory=' | cut -d= -f2-)
          IDX=$(printf '%s\n' "$ALL" | grep -m1 '^ExecStart=' | grep -oE '/[^ ]*sync-server/index\.js' | head -1)
          if [ -n "$IDX" ]; then ROOT=$(dirname "$(dirname "$(dirname "$IDX")")"); elif [ -n "$WD" ] && [ -f "/mnt/r$WD/tools/sync-server/index.js" ]; then ROOT=$WD; else ROOT=/opt/xcpets-sync; fi
          [ -f "/mnt/r$ROOT/tools/sync-server/index.js" ] || { echo "sync-server code not found where the service runs it"; exit 1; }
          echo "service found; data folder found: $([ -d "/mnt/r$DATA" ] && echo yes || echo no)"
          # memory killer and builder error lines from the last day (addresses scrubbed)
          J=/mnt/r/var/log/journal
          if [ -d "$J" ]; then
            echo "out-of-memory kills in the log: $(journalctl -D "$J" -k --since -2d --no-pager 2>/dev/null | grep -ci 'out of memory\|oom-kill\|killed process')"
            echo "--- builder lines (last 25) ---"
            journalctl -D "$J" -u xcpets-sync --since -12h --no-pager -o cat 2>/dev/null | grep -i 'snapshot' | tail -25 | scrub | cut -c1-200
            echo "---"
          fi
          echo "builder settings: $(printf '%s\n' "$ALL" | grep -oE 'XP_(SNAPSHOT[A-Z_]*|HOLD)=[^ "]*' | tr '\n' ' ')"
          echo "service runs: $(printf '%s\n' "$ALL" | grep -m1 '^ExecStart=' | grep -oE '[^ /]*sync-server/[a-z]+\.js|[^ /]+\.js' | head -1)"
          echo "other units: $(ls /mnt/r/etc/systemd/system 2>/dev/null | grep -iE 'xcpets|snap|world|xp-|caddy' | tr '\n' ' ')"
          echo "cron lines naming xcpets: $(cat /mnt/r/var/spool/cron/crontabs/* /mnt/r/etc/cron.d/* /mnt/r/etc/crontab 2>/dev/null | grep -ci xcpets)"
          W="/mnt/r$DATA/world"; echo "world folder: $(ls "$W" 2>/dev/null | wc -l) entries, latest.json written $(date -u -r "$W/latest.json" +%FT%TZ 2>/dev/null)"
          echo "data folder entries: $(ls "/mnt/r$DATA" 2>/dev/null | sed -E 's/[0-9]{6,}/N/g' | sort | uniq -c | tr '\n' ' ' | cut -c1-300)"
          if [ -d "$J" ]; then
            echo "tick failures in 2 days: $(journalctl -D "$J" -u xcpets-sync --since -2d --no-pager -o cat 2>/dev/null | grep -c 'sync tick failed')"
            echo "--- service lines around the last good build (Nov 22 12:30-14:30 UTC, last 30) ---"
            journalctl -D "$J" -u xcpets-sync --since '2026-11-22 12:30' --until '2026-11-22 14:30' --no-pager -o short-iso 2>/dev/null | grep -v 'tick failed' | tail -30 | scrub | cut -c1-220
            echo "heap flag in ExecStart: $(printf '%s\n' "$ALL" | grep -m1 '^ExecStart=' | grep -oE 'max-old-space-size=[0-9]+' || echo none)"
            echo "why the service stopped in 2 h (counts): heap $(journalctl -D "$J" -u xcpets-sync --since -2h --no-pager -o cat 2>/dev/null | grep -ci 'heap out of memory'), oom-kill $(journalctl -D "$J" -u xcpets-sync --since -2h --no-pager -o cat 2>/dev/null | grep -ci 'oom-kill\|memory.max'), exits $(journalctl -D "$J" -u xcpets-sync --since -2h --no-pager -o cat 2>/dev/null | grep -oE 'status=[0-9]+/[A-Z]*|code=[a-z]+, status=[0-9A-Z/]+' | sort | uniq -c | tr '\n' ' '), watchdog restarts $(journalctl -D "$J" -u xcpets-sync-watchdog --since -2h --no-pager -o cat 2>/dev/null | grep -ci restart)"
            echo "--- service lines since the repair (last 30) ---"
            journalctl -D "$J" -u xcpets-sync --since -2h --no-pager -o short-iso 2>/dev/null | tail -30 | scrub | cut -c1-220
            echo "---"
          fi
          # the separate world builder (XP_SNAPSHOT=0 on the sync service; a watch timer builds instead)
          for U in xcpets-sync-watch.timer xcpets-sync-watch.service; do F=/mnt/r/etc/systemd/system/$U; [ -f "$F" ] || continue
            echo "== $U: $(grep -hE '^(OnCalendar|OnUnitActiveSec|OnBootSec|Type|TimeoutStartSec|TimeoutSec|RuntimeMaxSec|MemoryMax|Nice)=' "$F" | tr '\n' ' ')"
            X=$(grep -m1 '^ExecStart=' "$F" | cut -d= -f2- | grep -oE '/[^ ]+\.(sh|js|py)' | head -1)
            [ -n "$X" ] && echo "   runs $(basename "$X") ($(wc -l < "/mnt/r$X" 2>/dev/null) lines); its snapshot/world lines:" && grep -nE 'snapshot|latest|world|pending|XP_|timeout|lock' "/mnt/r$X" 2>/dev/null | grep -viE 'token|secret|pass|key|auth' | scrub | cut -c1-200 | head -30
          done
          ls -la /mnt/r/etc/systemd/system/timers.target.wants 2>/dev/null | grep -o 'xcpets[^ ]*' | sed 's/^/   enabled timer: /'
          if [ -d "$J" ]; then
            echo "--- watch lines, last 40 ---"
            journalctl -D "$J" -u xcpets-sync-watch.service --since -3d --no-pager -o short-iso 2>/dev/null | tail -40 | scrub | cut -c1-220
            echo "--- watch lines around 13:00-14:30 UTC ---"
            journalctl -D "$J" -u xcpets-sync-watch.service --since '2026-11-22 13:00' --until '2026-11-22 14:30' --no-pager -o short-iso 2>/dev/null | tail -25 | scrub | cut -c1-220
            echo "---"
          fi
          # the feed job (api/boot.json, meta.json, pets.json to main every ~20 min). Nov 24 2026: it stopped at 977,257 for 16 hours
          # while the sync service was fine. Its unit, the script's command lines and its log (secrets filtered, addresses scrubbed).
          for U in xcpets-feed.timer xcpets-feed.service; do F=/mnt/r/etc/systemd/system/$U; [ -f "$F" ] || continue
            echo "== $U: $(grep -hE '^(OnCalendar|OnUnitActiveSec|OnBootSec|Type|User|WorkingDirectory|TimeoutStartSec|RuntimeMaxSec|MemoryMax)=' "$F" ${F}.d/*.conf 2>/dev/null | tr '\n' ' ')"
            X=$(grep -m1 '^ExecStart=' "$F" | cut -d= -f2- | grep -oE '/[^ ]+\.(sh|js|py)' | head -1)
            [ -n "$X" ] && echo "   runs $(basename "$X") ($(wc -l < "/mnt/r$X" 2>/dev/null) lines, changed $(date -u -r "/mnt/r$X" +%F 2>/dev/null)); its commands:" && grep -nvE '^\s*(#|$)' "/mnt/r$X" 2>/dev/null | grep -viE 'token|secret|pass|key|auth|cred|ssh|@' | scrub | cut -c1-200 | head -60 | sed 's/^/   /'
          done
          if [ -d "$J" ]; then
            echo "feed runs in 2 days: $(journalctl -D "$J" -u xcpets-feed --since -2d --no-pager -o cat 2>/dev/null | grep -c 'Starting\|Started')"
            echo "--- feed result lines, 2 days (last 25) ---"
            journalctl -D "$J" -u xcpets-feed --since -2d --no-pager -o short-iso 2>/dev/null | grep -iE 'systemd|error|fail|timeout|killed|exit|refused|rejected|conflict|block [0-9]|pushed|skipping|no change' | grep -viE 'token|secret|pass|auth|cred' | tail -25 | scrub | cut -c1-220
            echo "--- feed lines, last run (last 40) ---"
            journalctl -D "$J" -u xcpets-feed --since -3h --no-pager -o short-iso 2>/dev/null | grep -viE 'token|secret|pass|auth|cred' | tail -40 | scrub | cut -c1-220
            echo "---"
          fi
          for F in "$UNIT" ${ENVF:+"/mnt/r$ENVF"}; do grep -q 'XP_SNAPSHOT=0' "$F" 2>/dev/null && echo "XP_SNAPSHOT=0 is set in $(basename "$F"), file last changed $(date -u -r "$F" +%FT%TZ)"; done
          # rule files on the server vs main (these make the rsig pages compare against)
          mkdir -p /root/rm && tar -C /root/rm -xzf /root/rules.tgz
          DIFF=""; for f in $(cd /root/rm && find . -type f | sed 's#^\./##' | sort); do cmp -s "/root/rm/$f" "/mnt/r$ROOT/$f" || DIFF="$DIFF $f"; done
          echo "rule files that differ from main:${DIFF:- none}"
          echo "published world rsig: $(grep -oE '"rsig":"r[0-9a-f]+"' "/mnt/r$DATA/world/latest.json" | head -1) (main: $MAINRSIG)"
          if [ -d "/mnt/r$ROOT/.git" ]; then echo "server repo copy: git, HEAD $(cat /mnt/r$ROOT/.git/HEAD | sed 's#ref: refs/heads/##'), changed $(date -u -r /mnt/r$ROOT/.git/HEAD +%FT%TZ)"; fi
          # node cache path (node.xcpets.fun/v2): the cache, the Start9 proxy and tor. Unit settings and log tails, addresses scrubbed.
          for U in xcpets-node-cache xcpets-start9-proxy tor tor@default caddy; do
            F=$(ls /mnt/r/etc/systemd/system/$U.service /mnt/r/lib/systemd/system/$U.service 2>/dev/null | head -1)
            [ -n "$F" ] || { echo "== $U: no unit file"; continue; }
            EN=$(ls /mnt/r/etc/systemd/system/*.wants/ 2>/dev/null | grep -c "^$U.service$")
            echo "== $U (enabled links: $EN): $(grep -hE '^(Type|Restart|RestartSec|TimeoutStartSec|MemoryMax|After|Requires)=' "$F" | tr '\n' ' ')"
            X=$(grep -m1 '^ExecStart=' "$F" | cut -d= -f2- | grep -oE '/[^ ]+\.(sh|js|py)' | head -1)
            [ -n "$X" ] && echo "   runs $(basename "$X") ($(wc -l < "/mnt/r$X" 2>/dev/null) lines)"
            if [ -d "$J" ]; then
              echo "   restarts/failures in 2 days: $(journalctl -D "$J" -u $U --since -2d --no-pager -o cat 2>/dev/null | grep -ciE 'failed|start request repeated|main process exited|killed')"
              echo "   --- last 25 lines ---"
              journalctl -D "$J" -u $U --since -6h --no-pager -o short-iso 2>/dev/null | tail -25 | scrub | cut -c1-220 | sed 's/^/   /'
            fi
          done
          if [ -d "$J" ]; then echo "--- kernel/oom lines since -6h (last 10) ---"; journalctl -D "$J" -k --since -6h --no-pager -o short-iso 2>/dev/null | grep -iE 'oom|killed process|out of memory' | tail -10 | scrub | cut -c1-200; fi
          # memory and routing (Nov 22: /v2 gave 502 while the sync service ran out of heap and the box swapped). Ports and
          # address kinds only: loopback stays, private/tailnet ranges become <lan>/<tailnet>, everything else <ip>.
          ipkind() { sed -E 's/\b127\.0\.0\.1\b/LOOPBACK/g; s/\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+/<tailnet>/g; s/\b(10\.[0-9]+|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]+\.[0-9]+/<lan>/g; s/\b192\.168\.[0-9]+\.[0-9]+/<lan>/g' | scrub | sed 's/LOOPBACK/127.0.0.1/g'; }
          echo "== memory: $(awk '/MemTotal/{print int($2/1024)" MB RAM"}' /proc/meminfo); swap in fstab: $(grep -v '^#' /mnt/r/etc/fstab 2>/dev/null | awk '$3=="swap"{print $1}' | sed 's#.*/##' | tr '\n' ' ')$(ls -la /mnt/r/swapfile /mnt/r/swap.img 2>/dev/null | awk '{print int($5/1048576)" MB "$NF}' | tr '\n' ' ')"
          for U in xcpets-sync xcpets-node-cache xcpets-start9-proxy caddy; do F=$(ls /mnt/r/etc/systemd/system/$U.service /mnt/r/lib/systemd/system/$U.service 2>/dev/null | head -1); [ -n "$F" ] || continue
            EF=$(grep -h '^EnvironmentFile=' "$F" | head -1 | cut -d= -f2- | sed 's/^-//')
            echo "   $U limits/settings: $(grep -hE '^(MemoryMax|MemoryHigh|MemoryLow|OOMScoreAdjust|Nice|CPUWeight)=' "$F" | tr '\n' ' ') $( (cat "$F"; [ -n "$EF" ] && cat "/mnt/r$EF" 2>/dev/null) | grep -oE '\b(NODE_OPTIONS|XP_SNAPSHOT[A-Z_]*|XP_PORT|PORT|LISTEN[A-Z_]*|[A-Z_]*_PORT|MAX_[A-Z_]*|[A-Z_]*TIMEOUT[A-Z_]*)=[^ "]*' | ipkind | tr '\n' ' ')"
            [ -d /mnt/r/etc/systemd/system/$U.service.d ] && echo "   $U drop-ins: $(cat /mnt/r/etc/systemd/system/$U.service.d/*.conf 2>/dev/null | grep -vE '^\s*(#|$)' | grep -viE 'token|secret|pass|key|auth' | ipkind | tr '\n' ' ' | cut -c1-300)"
          done
          for X in $(for U in xcpets-node-cache xcpets-start9-proxy; do grep -h -m1 '^ExecStart=' /mnt/r/etc/systemd/system/$U.service 2>/dev/null | grep -oE '/[^ ]+\.js' | head -1; done); do
            echo "   $(basename "$X") listen/limit lines: $(grep -nE 'listen\(|PORT|timeout|Timeout|too large|MAX|maxBody|socks|9050' "/mnt/r$X" 2>/dev/null | grep -viE 'token|secret|pass|auth' | ipkind | cut -c1-140 | head -14 | tr '\n' '|')"
          done
          NC=$(grep -h -m1 '^ExecStart=' /mnt/r/etc/systemd/system/xcpets-node-cache.service 2>/dev/null | grep -oE '/[^ ]+\.js' | head -1)
          [ -n "$NC" ] && { echo "--- node cache: cache and request code (lines 70-130, scrubbed) ---"; sed -n '70,130p' "/mnt/r$NC" | grep -viE 'token|secret|pass|auth' | ipkind | cut -c1-170; }
          echo "   sync service restart policy: $(grep -hE '^(Restart|RestartSec|StartLimit[A-Za-z]*)=' "$UNIT" /mnt/r/etc/systemd/system/xcpets-sync.service.d/*.conf 2>/dev/null | tr '\n' ' ')"
          CF=$(ls /mnt/r/etc/caddy/Caddyfile 2>/dev/null)
          [ -n "$CF" ] && echo "== Caddy routes: $(grep -nE 'reverse_proxy|handle|route|^[^ #].*\{|to |lb_|health|fail_duration|dial_timeout|response_header_timeout' "$CF" | grep -viE 'token|secret|pass|auth|basicauth' | ipkind | sed -E 's/\s+/ /g' | tr '\n' '|' | cut -c1-900)"
          if [ -d "$J" ]; then
            for B in -1 0; do
              echo "--- boot $B: caddy upstream errors by target and reason (last 30 s of the boot left out) ---"
              journalctl -D "$J" -b $B -u caddy --no-pager -o short-unix 2>/dev/null > /tmp/cad.log
              END=$(tail -1 /tmp/cad.log | cut -d. -f1); [ -n "$END" ] || END=0
              awk -v e="$END" '{split($1,a,"."); if (a[1] < e-30) print}' /tmp/cad.log | grep '"level":"error"' | sed -nE 's/.*"msg":"([^"]*)".*"uri":"(\/[A-Za-z0-9_-]*).*/\1  path \2/p' | ipkind | sort | uniq -c | sort -rn | head -12
              echo "   errors per 10 min (server time): $(journalctl -D "$J" -b $B -u caddy --no-pager -o short-iso 2>/dev/null | grep '"level":"error"' | cut -c12-15 | uniq -c | tr -s ' ' | tr '\n' ',' | cut -c1-400)"
            done
            for U in xcpets-node-cache xcpets-start9-proxy; do
              echo "--- $U lines in 2 days by kind ---"
              journalctl -D "$J" -u $U --since -2d --no-pager -o cat 2>/dev/null | ipkind | sed -E 's/[0-9]+/N/g' | sort | uniq -c | sort -rn | head -12 | cut -c1-160
            done
            echo "--- sync service: out-of-heap crashes and memory peaks in 2 days ---"
            journalctl -D "$J" -u xcpets-sync --since -2d --no-pager -o short-iso 2>/dev/null | grep -E 'heap out of memory|memory peak|snapshot: (Error|over)|snapshot exit|publish failed|rules: ' | ipkind | cut -c1-200 | tail -30
            echo "--- memory peaks of the other units in 2 days ---"
            journalctl -D "$J" --since -2d --no-pager -o short-iso 2>/dev/null | grep -E 'memory peak' | grep -v 'xcpets-sync.service' | sed -E 's/.*systemd\[1\]: //' | cut -c1-160 | tail -15
          fi
          if [ "$LOOK" = "true" ]; then echo "diagnose only: nothing changed"; umount /mnt/r; exit 0; fi
          echo "swap/memory: $(grep -E 'MemTotal' /proc/meminfo | awk '{print int($2/1024)" MB RAM in rescue"}')"
          N=$(ls -d "/mnt/r$DATA"/pending-* 2>/dev/null | wc -l)
          echo "leftover build folders: $N ($(du -smc "/mnt/r$DATA"/pending-* 2>/dev/null | tail -1 | cut -f1) MB)"
          [ "$N" -gt 0 ] && rm -rf "/mnt/r$DATA"/pending-* && echo "removed them"
          if [ "$RULES" = "true" ] && [ -n "$DIFF" ]; then
            B="/mnt/r$ROOT/.rules-before-$(date -u +%Y%m%d%H%M)"; mkdir -p "$B"
            for f in $DIFF; do mkdir -p "$B/$(dirname $f)"; cp -a "/mnt/r$ROOT/$f" "$B/$f" 2>/dev/null; OWN=$(stat -c %u:%g "/mnt/r$ROOT/$f" 2>/dev/null || echo 0:0); cp "/root/rm/$f" "/mnt/r$ROOT/$f"; chown "$OWN" "/mnt/r$ROOT/$f"; done
            echo "installed the rule files from main (old copies kept in $(basename "$B"))"
          fi
          if [ "$RULES" = "true" ] && ! grep -q "\"rsig\":\"$MAINRSIG\"" "/mnt/r$DATA/world/latest.json"; then
            mv "/mnt/r$DATA/world/latest.json" "/mnt/r$DATA/world/latest.json.old-rsig" && echo "set the old-rsig world aside so a new one is built right after boot"
          fi
          # every file under the data folder must belong to the service user (a world folder made by root broke publishing: EACCES)
          SU=$(stat -c %u:%g "/mnt/r$DATA/state.json" 2>/dev/null || stat -c %u:%g "/mnt/r$DATA")
          NB=$(find "/mnt/r$DATA" ! -user "${SU%%:*}" 2>/dev/null | wc -l)
          echo "entries in the data folder not owned by the service user: $NB"
          ls -ld "/mnt/r$DATA"/world/r* 2>/dev/null | awk '{print "   " $3 " " $NF}' | sed 's#.*/world/#   world/#;s#^#  #' | head -8
          [ "$NB" -gt 0 ] && chown -R "$SU" "/mnt/r$DATA" && echo "gave them back to the service user"
          if [ "$BUILD" = "true" ]; then
            for F in "$UNIT" ${ENVF:+"/mnt/r$ENVF"}; do
              if grep -q 'XP_SNAPSHOT=0' "$F" 2>/dev/null; then cp -a "$F" "$F.bak-$(date -u +%Y%m%d%H%M)"; sed -i 's/XP_SNAPSHOT=0/XP_SNAPSHOT=1/' "$F"; echo "world builder turned on in $(basename "$F") (old copy kept as .bak)"; fi
            done
          fi
          echo "sync memory limits now: $(cat "$UNIT" /mnt/r/etc/systemd/system/xcpets-sync.service.d/*.conf 2>/dev/null | grep -oE '^Memory(High|Max)=[^ ]+' | tr '\n' ' ')"
          if [ "$SMEM" = "true" ] && [ "$LOOK" != "true" ]; then
            # Nov 23 2026 (Jake approved): the burn check service (~1 GB) runs inside this service next to the follower (~0.7-0.9 GB).
            # A drop-in read after the unit's own lines; the checker still waits for 1,200 MB free on the machine and stops during builds.
            mkdir -p /mnt/r/etc/systemd/system/xcpets-sync.service.d
            # Nov 24 2026: the server was meant to be 8 GB, but the plan picked by hand (CPX22) has about 2 GB: check the "== memory:" line, never the plan name. These limits assume 8 GB (CX33 or bigger). Node sizes its heap from the service's memory limit (~1 GB here), and the
            # service crash-looped about once a minute after the upgrade (65 starts in an hour, heap limit 984 MB). Give it room.
            printf '[Service]\nMemoryHigh=5000M\nMemoryMax=5600M\nEnvironment=NODE_OPTIONS=--max-old-space-size=3584\n' > /mnt/r/etc/systemd/system/xcpets-sync.service.d/zz-check-memory.conf
            echo "sync memory raised: $(grep -oE '^(Memory(High|Max)|Environment)=[^ ]+' /mnt/r/etc/systemd/system/xcpets-sync.service.d/zz-check-memory.conf | tr '\n' ' ')(drop-in zz-check-memory.conf; delete it to undo)"
          fi
          if [ "$UPDATE" = "true" ]; then
            T="/mnt/r$ROOT/tools"; B="sync-server.before-$(date -u +%Y%m%d%H%M)"
            cp -a "$T/sync-server" "$T/$B" && tar -C "/mnt/r$ROOT" -xzf /root/ss.tgz && echo "installed tools/sync-server from main (old copy kept as tools/$B)"
            OWN=$(stat -c %u:%g "$T/$B/index.js"); chown -R "$OWN" "$T/sync-server"
            chown -R "$OWN" "$T/lib"; for f in v2-boot-sync.js v2-chain.js block-hashes.js v2-grave-index.js; do chown "$OWN" "/mnt/r$ROOT/js/$f"; done; echo "installed the page scripts the service reads (boot sync, chain, block hashes, grave index)"
            grep -q 'XP_SNAPSHOT_MAX_MIN' "$T/sync-server/index.js" && echo "check: new builder code is in place"
          fi
          if [ "$DOG" = "true" ]; then
            # Nov 22 2026: the node cache stopped accepting connections (Caddy: dial 127.0.0.1:<port> i/o timeout, 3,000 times) while
            # its unit stayed 'running', so systemd never restarted it. Every minute this asks the cache directly; two misses in a
            # row (no answer at all within 15 s, any HTTP status counts as an answer) restart it. The cache also gets CPU priority
            # over the world builder.
            NCPORT=$(grep -hoE 'LISTEN_PORT=[0-9]+' /mnt/r/etc/systemd/system/xcpets-node-cache.service 2>/dev/null | head -1 | cut -d= -f2); NCPORT=${NCPORT:-18500}
            cat > /mnt/r/usr/local/bin/xcpets-node-watchdog.sh <<WD
          #!/bin/sh
          # restart the node cache when it does not answer twice in a row (installed by server-repair)
          command -v curl >/dev/null 2>&1 || exit 0
          F=/run/xcpets-node-watchdog.miss
          C=\$(curl -s -o /dev/null -m 15 -w '%{http_code}' http://127.0.0.1:$NCPORT/v2/ 2>/dev/null)
          if [ "\$C" != "000" ] && [ -n "\$C" ]; then rm -f \$F; exit 0; fi
          if [ -f \$F ]; then rm -f \$F; echo "node cache did not answer twice: restarting it"; systemctl restart xcpets-node-cache.service; else touch \$F; echo "node cache did not answer once"; fi
          WD
            sed -i 's/^          //' /mnt/r/usr/local/bin/xcpets-node-watchdog.sh; chmod 755 /mnt/r/usr/local/bin/xcpets-node-watchdog.sh
            printf '[Unit]\nDescription=XCPETS node cache watchdog\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/xcpets-node-watchdog.sh\n' > /mnt/r/etc/systemd/system/xcpets-node-watchdog.service
            printf '[Unit]\nDescription=XCPETS node cache watchdog, every minute\n[Timer]\nOnBootSec=3min\nOnUnitActiveSec=1min\nAccuracySec=10s\n[Install]\nWantedBy=timers.target\n' > /mnt/r/etc/systemd/system/xcpets-node-watchdog.timer
            mkdir -p /mnt/r/etc/systemd/system/timers.target.wants && ln -sf /etc/systemd/system/xcpets-node-watchdog.timer /mnt/r/etc/systemd/system/timers.target.wants/xcpets-node-watchdog.timer
            mkdir -p /mnt/r/etc/systemd/system/xcpets-node-cache.service.d && printf '[Service]\nCPUWeight=300\nOOMScoreAdjust=-500\nRestart=always\nRestartSec=3\n' > /mnt/r/etc/systemd/system/xcpets-node-cache.service.d/priority.conf
            # the sync service restarts itself (exit 75) to load new rules; make sure systemd always starts it again
            mkdir -p /mnt/r/etc/systemd/system/xcpets-sync.service.d && printf '[Unit]\nStartLimitIntervalSec=0\n[Service]\nRestart=always\nRestartSec=5\n' > /mnt/r/etc/systemd/system/xcpets-sync.service.d/restart.conf
            # The cache tests every answer for an onion address with /[A-Za-z0-9._-]+\.onion/, which is quadratic on long runs of
            # letters and digits (hex, base64): one big answer can hold its only thread for minutes, so every other request times out.
            # A plain substring check first makes that linear; the regex still runs when '.onion' really appears.
            NCJS="/mnt/r$(grep -h -m1 '^ExecStart=' /mnt/r/etc/systemd/system/xcpets-node-cache.service 2>/dev/null | grep -oE '/[^ ]+\.js' | head -1)"
            if [ -f "$NCJS" ] && grep -q '  if (!ONION_RE.test(raw)) return buf;' "$NCJS" && ! grep -q "indexOf('.onion')" "$NCJS"; then
              cp -a "$NCJS" "$NCJS.bak-$(date -u +%Y%m%d%H%M)"
              sed -i "s/  if (!ONION_RE.test(raw)) return buf;/  if (raw.toLowerCase().indexOf('.onion') < 0 || !ONION_RE.test(raw)) return buf;/" "$NCJS"
              node -e "new (require('vm').Script)(require('fs').readFileSync(process.argv[1],'utf8').replace(/^#!.*/,''))" "$NCJS" 2>/dev/null || true
              grep -q "indexOf('.onion')" "$NCJS" && echo "node cache: onion check made linear (old copy kept as .bak)"
            fi
            [ -x /mnt/r/usr/bin/curl ] && echo "watchdog installed (curl present on the server)" || echo "WARNING: curl is missing on the server, the watchdog cannot check"
          fi
          if [ "${SDOG:-true}" = "true" ] && [ "$LOOK" != "true" ]; then
            # Nov 24 2026 (never freeze): Nov 23 the sync service answered health for hours while its follow loop was stuck, so
            # systemd saw nothing wrong. The service now stops itself when one follow step runs past 10 minutes; this watchdog is the
            # outside half: every minute it asks the service directly. Three misses in a row (no answer within 15 s), or a follow step
            # stuck for 15 minutes (the service's own guard did not fire), restart it. The published world stays on disk and is served
            # again within seconds. Restarts are logged to the journal (xcpets-sync-watchdog) and counted in /run.
            SPORT=$(printf '%s\n' "$ALL" | grep -oE 'XP_PORT=[0-9]+' | head -1 | cut -d= -f2); SPORT=${SPORT:-8787}
            cat > /mnt/r/usr/local/bin/xcpets-sync-watchdog.sh <<WD
          #!/bin/sh
          # restart the sync service when it stops answering or its follow loop is stuck (installed by server-repair)
          command -v curl >/dev/null 2>&1 || exit 0
          systemctl is-active --quiet xcpets-sync.service || { systemctl is-enabled --quiet xcpets-sync.service && echo "sync service not running: starting it" && systemctl start --no-block xcpets-sync.service; exit 0; }
          F=/run/xcpets-sync-watchdog.miss
          B=\$(curl -s -m 15 http://127.0.0.1:$SPORT/xp/v1/health 2>/dev/null)
          if [ -z "\$B" ]; then
            N=\$(( \$(cat \$F 2>/dev/null || echo 0) + 1 )); echo \$N > \$F
            if [ \$N -ge 3 ]; then rm -f \$F; echo "sync service did not answer 3 times in a row: restarting it"; date -u +%FT%TZ >> /run/xcpets-sync-watchdog.restarts; systemctl restart xcpets-sync.service; else echo "sync service did not answer (\$N)"; fi
            exit 0
          fi
          rm -f \$F
          S=\$(printf '%s' "\$B" | grep -oE '"stepSec":[0-9]+' | head -1 | cut -d: -f2)
          if [ -n "\$S" ] && [ "\$S" -ge 900 ]; then echo "sync follow step stuck for \$S s: restarting the service"; date -u +%FT%TZ >> /run/xcpets-sync-watchdog.restarts; systemctl restart xcpets-sync.service; fi
          exit 0
          WD
            sed -i 's/^          //' /mnt/r/usr/local/bin/xcpets-sync-watchdog.sh; chmod 755 /mnt/r/usr/local/bin/xcpets-sync-watchdog.sh
            printf '[Unit]\nDescription=XCPETS sync service watchdog\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/xcpets-sync-watchdog.sh\n' > /mnt/r/etc/systemd/system/xcpets-sync-watchdog.service
            printf '[Unit]\nDescription=XCPETS sync service watchdog, every minute\n[Timer]\nOnBootSec=4min\nOnUnitActiveSec=1min\nAccuracySec=10s\n[Install]\nWantedBy=timers.target\n' > /mnt/r/etc/systemd/system/xcpets-sync-watchdog.timer
            mkdir -p /mnt/r/etc/systemd/system/timers.target.wants && ln -sf /etc/systemd/system/xcpets-sync-watchdog.timer /mnt/r/etc/systemd/system/timers.target.wants/xcpets-sync-watchdog.timer
            # systemd must always start the service again (its own stall guard exits with 70, a rules update with 75)
            mkdir -p /mnt/r/etc/systemd/system/xcpets-sync.service.d && printf '[Unit]\nStartLimitIntervalSec=0\n[Service]\nRestart=always\nRestartSec=5\n' > /mnt/r/etc/systemd/system/xcpets-sync.service.d/restart.conf
            # The feed job (api/boot.json every ~20 min) hung the same way on Nov 23 (stuck at 977,257). A oneshot job has no time
            # limit by default, and its timer never starts a new run while one hangs. Now a run is stopped after 40 minutes.
            if [ -f /mnt/r/etc/systemd/system/xcpets-feed.service ]; then
              mkdir -p /mnt/r/etc/systemd/system/xcpets-feed.service.d && printf '[Service]\nTimeoutStartSec=40min\nRuntimeMaxSec=40min\n' > /mnt/r/etc/systemd/system/xcpets-feed.service.d/time-limit.conf
              echo "feed job: 40-minute time limit set (drop-in time-limit.conf)"
              # Nov 24 2026: the feed job died with 'JavaScript heap out of memory' (exit 134, in JSON.parse of the big issuance
              # reads) at 16:09 and 16:35 UTC, after the server moved to 8 GB too. Give its node a 4 GB heap.
              printf '[Service]\nEnvironment=NODE_OPTIONS=--max-old-space-size=4096\n' > /mnt/r/etc/systemd/system/xcpets-feed.service.d/heap.conf
              echo "feed job: 4 GB JavaScript heap set (drop-in heap.conf)"
            fi
            [ -x /mnt/r/usr/bin/curl ] && echo "sync watchdog installed (port from the service settings: $([ "$SPORT" = 8787 ] && echo default || echo custom))" || echo "WARNING: curl is missing on the server, the sync watchdog cannot check"
          fi
          echo "disk after: $(df -m /mnt/r | awk 'NR==2{print $4" MB free"}')"
          sync; umount /mnt/r
          EOS
      - name: Boot normally and remove the one-time key
        if: always()
        run: |
          [ -n "${SV:-}" ] || exit 0
          node -e "
            const H = { Authorization: 'Bearer ' + process.env.HCLOUD_TOKEN, 'Content-Type': 'application/json' }, api = 'https://api.hetzner.cloud/v1';
            (async () => {
              const r1 = await fetch(api + '/servers/' + process.env.SV + '/actions/disable_rescue', { method: 'POST', headers: H }); console.log('rescue off:', r1.status);
              await new Promise(r => setTimeout(r, 4000));
              const r2 = await fetch(api + '/servers/' + process.env.SV + '/actions/reboot', { method: 'POST', headers: H }); console.log('normal boot:', r2.status);
              if (process.env.KEYID) { const r3 = await fetch(api + '/ssh_keys/' + process.env.KEYID, { method: 'DELETE', headers: H }); console.log('one-time key deleted:', r3.status); }
            })().catch(e => { console.error(e.message); process.exit(1); });"
      - name: Wait for the game server and a new published world
        if: always() && github.event.inputs.diagnose_only != 'true'
        run: |
          sleep 45
          node -e "
            const t0 = Date.now(); let first = null, base = null;
            (async function loop() {
              try { const h = await (await fetch('https://node.xcpets.fun/xp/v1/health?cb=' + Date.now())).json(); delete h.upstream;
                if (h.tip) { if (!first) { first = Date.now(); console.log('back after ' + Math.round((first - t0) / 1000 + 45) + ' s:', JSON.stringify(h)); }
                  const l = await (await fetch('https://node.xcpets.fun/xp/v1/world/latest.json?cb=' + Date.now())).json();
                  if (base == null) base = l.tip;
                  if (l.tip > base || h.snapshotLag != null && h.snapshotLag < 6) { console.log('published world now at', l.tip, 'built', l.builtAt, JSON.stringify(h.builder || {})); return; }
                  if ((Date.now() - t0) % 120000 < 15000) console.log('waiting, world at', l.tip, 'builder', JSON.stringify(h.builder || {})); } } catch (e) {}
              if (Date.now() - t0 > 25 * 60000) { console.log('No new published world within 25 minutes. See the builder lines above.'); process.exit(1); }
              setTimeout(loop, 15000); })();"
