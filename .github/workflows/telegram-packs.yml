# XCPETS Telegram packs (Nov 24 2026): makes or refreshes HatchBot's sticker pack and custom emoji pack of every pet
# (hatchbot/stickers: images drawn from the game's own sprites, uploaded by hatchbot/stickers/packs.js), then makes the sticker
# pack the group's sticker set when HatchBot is allowed to. Runs by hand (Actions > telegram-packs > Run workflow) and whenever
# the pack images change on main. The packs belong to the Telegram group's creator; type another Telegram user id to change that.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID. Nothing here touches wallets or the game.
name: telegram-packs
on:
  push:
    branches: [main]
    paths: ['hatchbot/stickers/sticker/**', 'hatchbot/stickers/emoji/**', 'hatchbot/stickers/pets.json']
  workflow_dispatch:
    inputs:
      owner_id:
        description: 'Optional: Telegram user id of the pack owner (leave empty = the XCPETS group creator)'
        required: false
        default: ''
permissions: { contents: read }
concurrency: { group: telegram-packs, cancel-in-progress: false }
jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OWNER_ID: ${{ github.event.inputs.owner_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Make or refresh the packs
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::notice::HatchBot is not set up (TELEGRAM_BOT_TOKEN)."; exit 0; fi
          node hatchbot/stickers/packs.js
