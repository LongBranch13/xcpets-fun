# Backup of the Hetzner feed. The timer on xcpets-bot-1 runs /usr/local/bin/xcpets-feed.sh (the primary writer). Once started (by hand or by world watch),
# this workflow keeps a watch loop going: it builds only while the server's feed is 20+ minutes old (Nov 27 2026).
# This file rebuilds api/pets.json + api/meta.json from chain with tools/api-feed.js (Node only, public read APIs, no secrets)
# and refreshes pet token metadata t/<id>.json + .png for tokened pets (tools/token-meta.js --tokened).
# It commits only when the pets, totals or token files changed (generatedAt alone never triggers a commit). It only ever stages api/pets.json + api/meta.json + api/boot.json (site-fast first-visit copy),
# and merges (never rebases or force-pushes) the latest origin/main before pushing, so it can't clobber normal deploys.
# sale-cache-feed (Oct 24, 2026): it also commits api/boot.json + api/recent-events.json (per-block event lists of the last 60 blocks, tools/recent-events.js)
# whenever the chain tip moved FRESH_BLOCKS or more since the committed boot.json, even with no pet change, so the shipped sale copy stays a few blocks old.
# Push trigger removed Nov 12, 2026. It used to run after every site deploy. Those commits are pushed with GITHUB_TOKEN, which does not start
# the Pages workflow, and on Nov 11 they conflicted with the VPS pushes and stalled the live site about 1.5 hours. Pages deploy is pages.yml and is unchanged.
name: api-feed
on:
  # schedule (cron */10) REMOVED Oct 27, 2026 (cx23 step 9, owner approved): the feed now runs on Hetzner xcpets-bot-1 (xcpets-feed.timer). Start by hand with workflow_dispatch if the server is down.
  workflow_dispatch: {}
permissions: { contents: write, actions: write }
concurrency: { group: api-feed, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40  # (30 + the 5-minute pause before the next backup run) feed-rate-limit: a full (non-incremental) sale read at the gated pace took ~15.4 min in the Oct 25 dry run
    steps:
      # Nov 27 2026: the loop below used to stop for good the first time the server published a feed. The server's feed job then
      # published twice (23:06 and 23:50 UTC Nov 26) and died again, world watch's GitHub cron did not run for 5 hours, and the feed
      # fell 12+ blocks behind (HatchBot's "catching up" post at 01:40 UTC). Now the loop never ends by itself: each run first asks
      # whether a build is needed (no checkout, a few seconds). While the server's own feed is fresh it only watches; the moment the
      # server's feed is 20+ minutes old it builds and publishes again.
      - name: Is a backup build needed?
        id: need
        env: { GH_TOKEN: '${{ github.token }}', FRESH_MIN: '20' }
        run: |
          J=$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&path=api/meta.json&per_page=1" --jq '.[0] | {m: .commit.message, t: .commit.committer.date}' || echo '{}')
          AT=$(printf '%s' "$J" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Math.floor(Date.parse(JSON.parse(s).t)/1000)||0)}catch(e){console.log(0)}})")
          AGE=$(( $(date +%s) - ${AT:-0} ))
          if printf '%s' "$J" | grep -q 'Feed-Source: github-backup'; then SRC=backup; else SRC=server; fi
          if [ "$SRC" = server ] && [ "$AT" -gt 0 ] && [ "$AGE" -lt $((FRESH_MIN * 60)) ]; then
            echo "The server's feed published $((AGE / 60)) min ago: watching only, no build." | tee -a "$GITHUB_STEP_SUMMARY"; echo "build=" >> "$GITHUB_OUTPUT"
          else
            echo "Newest feed is from the $SRC, $((AGE / 60)) min old: building." | tee -a "$GITHUB_STEP_SUMMARY"; echo "build=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.need.outputs.build == '1'
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        if: steps.need.outputs.build == '1'
        with: { node-version: '20' }
      - if: steps.need.outputs.build == '1'
        run: node tools/api-feed.js --out api --save-input /tmp/feed-input.json
      # Pet token metadata (Oct 23, 2026): refresh t/<id>.json + t/<id>.png only for tokened pets (tied, freshly minted, or already named). Never fails the feed.
      # token-proof: --input is the feed step's chain read. token-meta replays that input once and reuses its dex issuances (no second DEX read).
      # Mint lookback starts at api/token-meta-state.json lastBlock (only advanced when the full-node scan succeeded), not a fixed 36 blocks.
      - if: steps.need.outputs.build == '1'
        run: node tools/token-meta.js --tokened --input /tmp/feed-input.json || echo "token-meta failed, skipping this run"
      # sale-cache-feed: optional, never fails the feed (a failed read leaves the old file; the browser then checks blocks on a :4000 node or reads in full)
      - if: steps.need.outputs.build == '1'
        run: node tools/recent-events.js --out api --blocks 60 || echo "recent-events failed, skipping"
      - name: Commit if changed
        id: commit
        if: steps.need.outputs.build == '1'
        env: { FRESH_BLOCKS: '2' }
        run: |
          OLD=$(git show HEAD:api/boot.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).tip||0)}catch(e){console.log(0)}})")
          NEW=$(node -p "require('./api/boot.json').tip||0")
          if [ $((NEW - OLD)) -ge "$FRESH_BLOCKS" ]; then echo "tip $OLD -> $NEW: refreshing boot copy"; FRESH=1; else FRESH=; fi
          if [ -z "$FRESH" ] && git diff --quiet -- api/pets.json api/ties.json t && [ -z "$(git ls-files --others --exclude-standard api/ties.json)" ] && [ -z "$(git ls-files --others --exclude-standard t)" ] && ! git diff -U0 -- api/meta.json | grep -E '^[+-] ' | grep -v generatedAt | grep -q .; then echo "no change"; exit 0; fi
          # GitHub refuses any file over 100 MB, and one such file blocks the whole push (Nov 24 2026: recent-events.json at 114 MB
          # stopped the feed for 16 hours). Keep the committed copy of an oversized file and publish the rest.
          for f in api/*.json; do [ -f "$f" ] || continue; if [ "$(stat -c %s "$f")" -gt 95000000 ]; then echo "::warning::$f is $(stat -c %s "$f") bytes (GitHub's limit is 100 MB): keeping the committed copy"; git checkout -q HEAD -- "$f" 2>/dev/null || rm -f "$f"; fi; done
          git config user.name "xcpets-api-bot"; git config user.email "actions@users.noreply.github.com"
          git add api/pets.json api/meta.json api/boot.json t
          git add api/recent-events.json 2>/dev/null || true
          git add api/token-meta-state.json 2>/dev/null || true
          git add api/ties.json 2>/dev/null || true
          git commit -m "api feed: block $(node -p "require('./api/meta.json').blockHeight")" -m "Feed-Source: github-backup"
          FEED=$(git rev-parse HEAD)
          FILES=$(git diff --name-only --no-renames HEAD~1 HEAD -- api t)
          bh() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).blockHeight||0)}catch(e){console.log(0)}})"; }
          for i in 1 2 3 4 5; do
            git fetch origin main
            ours=$(git show $FEED:api/meta.json | bh); theirs=$(git show origin/main:api/meta.json | bh)
            # Server feed (xcpets-bot-1) is the primary writer; if it already published our block or newer, this run is redundant.
            if [ "$theirs" -ge "$ours" ]; then echo "::notice::main already at block $theirs (ours $ours); skipping"; exit 0; fi
            if ! git merge --no-edit --no-ff origin/main; then
              # Our feed data is newer: keep our whole copy of every feed file this run wrote (never mix JSON hunks).
              BAD=$(git diff --name-only --diff-filter=U | grep -vE '^(api|t)/' || true)
              if [ -n "$BAD" ]; then echo "merge conflict outside api/ t/: $BAD"; git merge --abort; exit 1; fi
              echo "$FILES" | xargs -r git checkout $FEED --
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then echo "unresolved: $(git diff --name-only --diff-filter=U)"; git merge --abort; exit 1; fi
              for f in api/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "bad json $f"; git merge --abort; exit 1; }; done
              git commit --no-edit -q
              echo "merge conflict on feed files resolved with our newer block $ours (main was $theirs)"
            fi
            if git push origin HEAD:main; then echo "pushed"; echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            git reset -q --hard $FEED
            sleep $((i * 10))
          done
          echo "push failed after retries"; exit 1
      # Nov 24 2026: a push made with GITHUB_TOKEN does not start pages.yml, so a backup feed reached main but not xcpets.fun
      # (HatchBot /burns and the site read the published copy). Ask for a Pages deploy by hand; it queues behind a running one.
      - name: Publish the new feed to the site
        if: steps.commit.outputs.pushed == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Started a Pages deploy for the new feed."
      # Nov 24 2026: after the backup caught up at 13:10 UTC the feed fell behind again within the hour: the server's feed job was
      # still not publishing, and world watch's 15-minute schedule (GitHub cron) did not run for hours, so nothing started the next
      # backup. While the server's feed is down the backup now keeps itself going: about every 20 minutes it starts the next run.
      # It stops by itself once the server publishes again (a feed commit without the github-backup line from the last 45 minutes).
      - name: Keep the backup going while the server's feed is down
        # (Nov 24 2026: the switch is read in the shell. In a GitHub `if:` an unset variable is '' and '' != '0' is false, because
        # both turn into the number 0, so the step was always skipped and the loop never ran.)
        # Nov 27 2026: the loop no longer stops when the server publishes (see "Is a backup build needed?"). A run that only watched
        # waits 4 minutes, a run that built waits 5. Only one chain: if another api-feed run is already queued or running (world watch
        # started one), this run starts no next run.
        if: always() && github.event_name == 'workflow_dispatch'
        env: { GH_TOKEN: '${{ github.token }}', LOOP_SWITCH: '${{ vars.FEED_BACKUP_LOOP }}', BUILT: '${{ steps.need.outputs.build }}' }
        run: |
          if [ "$LOOP_SWITCH" = "0" ]; then echo "FEED_BACKUP_LOOP=0: the backup loop is off."; exit 0; fi
          if [ "$BUILT" = "1" ]; then sleep 300; else sleep 240; fi
          OTHER=$(gh run list -R "$GITHUB_REPOSITORY" --workflow api-feed.yml --limit 10 --json databaseId,status --jq "[.[]|select(.status!=\"completed\" and .databaseId!=$GITHUB_RUN_ID)]|length" || echo 0)
          if [ "${OTHER:-0}" != "0" ]; then echo "Another api-feed run is already waiting: it carries the loop on."; exit 0; fi
          gh workflow run api-feed.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Started the next feed check." | tee -a "$GITHUB_STEP_SUMMARY"
