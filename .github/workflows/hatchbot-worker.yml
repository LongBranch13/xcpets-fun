# HatchBot commands (/pet, /burns, /whosthat, /breed, /battle, /meme, /chainday, /bug, /help) on Cloudflare Workers. Deploys hatchbot/worker.js, then points
# the Telegram bot at it and sets its command list. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN.
# Until they are set this job does nothing.
name: hatchbot-worker
on:
  push:
    branches: [main]
    paths: ['hatchbot/worker.js', 'hatchbot/bugs-to-issues.js', 'hatchbot/captions.json', 'hatchbot/wrangler.toml', 'hatchbot/build-memes.js', '.github/workflows/hatchbot-worker.yml']
  workflow_dispatch: {}
permissions: { contents: read }
concurrency: { group: hatchbot-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Check setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::notice::HatchBot commands are not set up yet (Cloudflare + Telegram secrets)."; echo "go=" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go
        with: { node-version: '20' }
      - name: Build meme list
        if: steps.ready.outputs.go
        run: node hatchbot/build-memes.js
      - name: Bug report storage (Cloudflare KV)
        if: steps.ready.outputs.go
        working-directory: hatchbot
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=(JSON.parse(s).result||[]).find(n=>n.title==='hatchbot-bugs');console.log(r?r.id:'')})")
          if [ -z "$ID" ]; then ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"title":"hatchbot-bugs"}' "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.id))"); fi
          printf '\n[[kv_namespaces]]\nbinding = "BUGS"\nid = "%s"\n' "$ID" >> wrangler.toml
      - name: Bot state (Cloudflare D1, for /whosthat rounds and cooldowns)
        if: steps.ready.outputs.go
        continue-on-error: true
        working-directory: hatchbot
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          DB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?name=hatchbot" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=(JSON.parse(s).result||[]).find(n=>n.name==='hatchbot');console.log(r?r.uuid:'')})")
          if [ -z "$DB" ]; then DB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"name":"hatchbot"}' "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.uuid))"); fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "hatchbot"\ndatabase_id = "%s"\n' "$DB" >> wrangler.toml
          npx --yes wrangler@3 d1 execute hatchbot --remote --file schema.sql --yes
      - name: Deploy worker
        if: steps.ready.outputs.go
        working-directory: hatchbot
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@3 secret put TELEGRAM_BOT_TOKEN
          node -e "process.stdout.write(require('crypto').createHash('sha256').update('hbtest:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex').slice(0,40))" | npx --yes wrangler@3 secret put HB_TEST_KEY
      - name: Point Telegram at the worker
        if: steps.ready.outputs.go
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.subdomain))")
          URL="https://hatchbot.$SUB.workers.dev/tg"
          SECRET=$(node -e "console.log(require('crypto').createHash('sha256').update('hatchbot:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex').slice(0,48))")
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -fsS "$API/setWebhook" -d "url=$URL" -d "secret_token=$SECRET" -d "drop_pending_updates=true" -o /dev/null
          CMDS='[{"command":"pet","description":"Pet card: /pet, /pet 123, /pet <name>, /pet <species>"},{"command":"burns","description":"Community burns and community pet progress"},{"command":"whosthat","description":"Guess the pet from its silhouette"},{"command":"breed","description":"A real breed from the chain (/breed <pet>)"},{"command":"battle","description":"A real arena battle (/battle <pet>)"},{"command":"meme","description":"A random XCPETS meme"},{"command":"chainday","description":"Current 144-block game day and blocks left"},{"command":"bug","description":"Report a bug to the XCPETS team"},{"command":"help","description":"List HatchBot commands"}]'
          for SCOPE in '{"type":"default"}' '{"type":"all_group_chats"}' '{"type":"all_private_chats"}'; do
            curl -fsS "$API/deleteMyCommands" --data-urlencode "scope=$SCOPE" -o /dev/null || true
            curl -fsS "$API/setMyCommands" --data-urlencode "commands=$CMDS" --data-urlencode "scope=$SCOPE" -o /dev/null
          done
          curl -fsS "$API/getWebhookInfo" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result;console.log('webhook ok:', !!r.url, 'pending:', r.pending_update_count, 'last error:', r.last_error_message||'none')})"
      - name: Self test (dry run, nothing is sent to Telegram)
        if: steps.ready.outputs.go
        continue-on-error: true
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.subdomain))")
          KEY=$(node -e "process.stdout.write(require('crypto').createHash('sha256').update('hbtest:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex').slice(0,40))")
          sleep 5
          for T in /help /pet "/pet 1765" "/pet dodo" /breed /battle /burns /chainday /meme; do
            OUT=$(curl -sS -m 30 -X POST -H "X-HB-Test: $KEY" -H 'content-type: application/json' -d "{\"text\":\"$T\",\"chat\":0}" "https://hatchbot.$SUB.workers.dev/selftest" || echo '{"err":"request failed"}')
            echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j;try{j=JSON.parse(s)}catch(e){console.log(process.argv[1]+' -> not JSON: '+s.slice(0,160));return}const o=(j.out||[]).map(x=>x.method+': '+String((x.body&&(x.body.text||x.body.caption))||'').split('\\n')[0].slice(0,70));console.log(process.argv[1]+' -> '+j.ms+' ms'+(j.err?' ERROR '+j.err:'')+' | '+o.join(' / '))})" "$T"
          done
