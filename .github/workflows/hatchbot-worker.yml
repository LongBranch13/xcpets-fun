# HatchBot commands (/play opens the mini app, /pet, /burns, /whosthat, /breed, /battle, /meme, /chainday, /season, /bug, /help) on Cloudflare Workers. Deploys hatchbot/worker.js, then points
# the Telegram bot at it and sets its command list. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TELEGRAM_BOT_TOKEN.
# Optional: TELEGRAM_CHAT_ID (the group for automatic posts, hatchbot/auto.js). TELEGRAM_ALERT_CHAT_ID: chats for game server alerts
# (hatchbot/serverwatch.js; anyone can also DM the bot /alerts). Automatic posts stay off until hatchbot/auto-config.json switches them on.
# Until they are set this job does nothing.
name: hatchbot-worker
on:
  push:
    branches: [main]
    paths: ['hatchbot/worker.js', 'hatchbot/auto.js', 'hatchbot/serverwatch.js', 'hatchbot/auto-config.json', 'hatchbot/bugs-to-issues.js', 'hatchbot/captions.json', 'hatchbot/wrangler.toml', 'hatchbot/build-memes.js', 'hatchbot/stickers/pets.json', '.github/workflows/hatchbot-worker.yml']
  workflow_dispatch:
    inputs:
      subdomain: { description: 'Optional: give the account a neutral workers.dev subdomain (only when hatchbot is the only worker)', required: false, default: '' }
permissions: { contents: read }
concurrency: { group: hatchbot-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
    steps:
      - name: Check setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::notice::HatchBot commands are not set up yet (Cloudflare + Telegram secrets)."; echo "go=" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go
        with: { node-version: '20' }
      - name: Build meme list
        if: steps.ready.outputs.go
        run: node hatchbot/build-memes.js
      - name: Bug report storage (Cloudflare KV)
        if: steps.ready.outputs.go
        working-directory: hatchbot
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=(JSON.parse(s).result||[]).find(n=>n.title==='hatchbot-bugs');console.log(r?r.id:'')})")
          if [ -z "$ID" ]; then ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"title":"hatchbot-bugs"}' "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.id))"); fi
          printf '\n[[kv_namespaces]]\nbinding = "BUGS"\nid = "%s"\n' "$ID" >> wrangler.toml
      - name: Automatic post state (Cloudflare KV, hatchbot/auto.js remembers what it already posted)
        if: steps.ready.outputs.go
        working-directory: hatchbot
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?per_page=100" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=(JSON.parse(s).result||[]).find(n=>n.title==='hatchbot-auto-state');console.log(r?r.id:'')})")
          if [ -z "$ID" ]; then ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"title":"hatchbot-auto-state"}' "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.id))"); fi
          printf '\n[[kv_namespaces]]\nbinding = "HB_STATE"\nid = "%s"\n' "$ID" >> wrangler.toml
      - name: Bot state (Cloudflare D1, for /whosthat rounds and cooldowns)
        if: steps.ready.outputs.go
        continue-on-error: true
        working-directory: hatchbot
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          DB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?name=hatchbot" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=(JSON.parse(s).result||[]).find(n=>n.name==='hatchbot');console.log(r?r.uuid:'')})")
          if [ -z "$DB" ]; then DB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d '{"name":"hatchbot"}' "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.uuid))"); fi
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "hatchbot"\ndatabase_id = "%s"\n' "$DB" >> wrangler.toml
          npx --yes wrangler@3 d1 execute hatchbot --remote --file schema.sql --yes
      - name: Deploy worker
        if: steps.ready.outputs.go
        working-directory: hatchbot
        run: |
          npx --yes wrangler@3 deploy
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@3 secret put TELEGRAM_BOT_TOKEN
          node -e "process.stdout.write(require('crypto').createHash('sha256').update('hbtest:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex').slice(0,40))" | npx --yes wrangler@3 secret put HB_TEST_KEY
          if [ -n "$TELEGRAM_CHAT_ID" ]; then printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@3 secret put TELEGRAM_CHAT_ID; fi
          if [ -n "$TELEGRAM_ALERT_CHAT_ID" ]; then printf '%s' "$TELEGRAM_ALERT_CHAT_ID" | npx --yes wrangler@3 secret put TELEGRAM_ALERT_CHAT_ID; fi
      - name: Neutral workers.dev address (by hand only)
        if: steps.ready.outputs.go && github.event.inputs.subdomain != ''
        env: { WANT: '${{ github.event.inputs.subdomain }}' }
        run: |
          case "$WANT" in *[!a-z0-9-]*) echo "::error::subdomain must be lowercase letters, digits and dashes"; exit 1;; esac
          N=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result||[];console.log(r.filter(x=>x.id!=='hatchbot').length)})")
          if [ "$N" != "0" ]; then echo "::warning::$N other worker(s) on this account would change address too; not renaming."; exit 0; fi
          curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "{\"subdomain\":\"$WANT\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.success?'renamed: hatchbot.'+process.env.WANT+'.workers.dev':'rename failed: '+JSON.stringify(j.errors))})"
          sleep 20
      - name: Point Telegram at the worker
        if: steps.ready.outputs.go
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.subdomain))")
          URL="https://hatchbot.$SUB.workers.dev/tg"
          SECRET=$(node -e "console.log(require('crypto').createHash('sha256').update('hatchbot:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex').slice(0,48))")
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -fsS "$API/setWebhook" -d "url=$URL" -d "secret_token=$SECRET" -d "drop_pending_updates=true" -o /dev/null
          CMDS='[{"command":"play","description":"Open the XCPETS app inside Telegram"},{"command":"pet","description":"Pet card: /pet, /pet 123, /pet <name>, /pet <species>"},{"command":"season","description":"The current XCPETS season and its countdown"},{"command":"burns","description":"XCPETS burned all time and today"},{"command":"whosthat","description":"Guess the pet from its silhouette"},{"command":"breed","description":"A real breed from the chain (/breed <pet>)"},{"command":"battle","description":"A real arena battle (/battle <pet>)"},{"command":"meme","description":"A random XCPETS meme"},{"command":"chainday","description":"Current 144-block game day and blocks left"},{"command":"stickers","description":"XCPETS stickers and emoji of every pet"},{"command":"bug","description":"Report a bug to the XCPETS team"},{"command":"help","description":"List HatchBot commands"}]'
          CMDS=$(node -e "const c=JSON.parse(process.argv[1]);if(require('./hatchbot/auto-config.json').commands.rate===true)c.splice(5,0,{command:'rate',description:'HatchBot rates a pet (/rate <pet>)'});console.log(JSON.stringify(c))" "$CMDS")
          for SCOPE in '{"type":"default"}' '{"type":"all_group_chats"}' '{"type":"all_private_chats"}'; do
            curl -fsS "$API/deleteMyCommands" --data-urlencode "scope=$SCOPE" -o /dev/null || true
            curl -fsS "$API/setMyCommands" --data-urlencode "commands=$CMDS" --data-urlencode "scope=$SCOPE" -o /dev/null
          done
          # XCPETS mini app: the "Play" button next to the text box in HatchBot's private chat opens xcpets.fun/tg/ inside Telegram.
          curl -fsS "$API/setChatMenuButton" --data-urlencode 'menu_button={"type":"web_app","text":"Play","web_app":{"url":"https://xcpets.fun/tg/"}}' -o /dev/null || echo "::warning::could not set the Play menu button"
          curl -fsS "$API/getWebhookInfo" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s).result;console.log('webhook ok:', !!r.url, 'pending:', r.pending_update_count, 'last error:', r.last_error_message||'none')})"
      - name: Self test (dry run, nothing is sent to Telegram)
        if: steps.ready.outputs.go
        continue-on-error: true
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.subdomain))")
          KEY=$(node -e "process.stdout.write(require('crypto').createHash('sha256').update('hbtest:'+process.env.TELEGRAM_BOT_TOKEN).digest('hex').slice(0,40))")
          sleep 5
          for T in /help /play /pet "/pet 1765" "/pet dodo" /breed /battle /burns /chainday /season /meme /stickers; do
            OUT=$(curl -sS -m 30 -X POST -H "X-HB-Test: $KEY" -H 'content-type: application/json' -d "{\"text\":\"$T\",\"chat\":0}" "https://hatchbot.$SUB.workers.dev/selftest" || echo '{"err":"request failed"}')
            echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j;try{j=JSON.parse(s)}catch(e){console.log(process.argv[1]+' -> not JSON: '+s.slice(0,160));return}const o=(j.out||[]).map(x=>x.method+': '+String((x.body&&(x.body.text||x.body.caption))||'').split('\\n')[0].slice(0,70));console.log(process.argv[1]+' -> '+j.ms+' ms'+(j.err?' ERROR '+j.err:'')+' | '+o.join(' / '))})" "$T"
          done
          OUT=$(curl -sS -m 60 -X POST -H "X-HB-Test: $KEY" -H 'content-type: application/json' -d '{"auto":"preview","back":144}' "https://hatchbot.$SUB.workers.dev/selftest" || echo '{"err":"request failed"}')
          echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{let j;try{j=JSON.parse(s)}catch(e){console.log('auto preview -> not JSON: '+s.slice(0,160));return}const p=(j.preview&&j.preview.posts)||[];console.log('auto preview -> '+j.ms+' ms'+(j.err?' ERROR '+j.err.split('\\n')[0]:'')+' | announce '+(j.config&&j.config.announce)+' | '+p.length+' sample posts: '+p.map(x=>x.type).join(', '))})"
