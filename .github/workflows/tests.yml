# Runs the whole test suite (tools/run-tests) on a fresh checkout. Read-only: no secrets, no deploy, nothing signed or broadcast.
name: tests
on:
  pull_request:
    paths-ignore: ['api/**']
  push:
    branches: [main]
    # Nov 22 2026: the game-server timer commits api/ (the feed) every 20-25 minutes. Each of those started a full
    # hour-long run of the same code, and about ten runs were stacked at once. Feed-only pushes no longer run the suite.
    paths-ignore: ['api/**']
permissions:
  contents: read
# A newer push to a pull request replaces the run still going for the older one. Pushes to main are never cancelled:
# each one compares replay against the push before it, so a skipped run would hide a rules change.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: playwright-core and canvas for the browser and sprite tests (uses the runner's Google Chrome)
        run: npm install --no-save --no-package-lock playwright-core@1 @napi-rs/canvas@0.1.80
      - name: run-tests (replay must stay SAME against the base)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="${{ github.event.before }}"; fi
          git rev-parse --verify -q "$BASE^{commit}" >/dev/null || BASE=origin/main
          node tools/run-tests --replay-base "$BASE"
