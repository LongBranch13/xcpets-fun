<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/v2.css">
<style>body{padding:12px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.c{background:#1b1530;border:2px solid #4b3f7a;padding:8px;text-align:center;color:#eee}.c canvas{width:128px;height:128px;image-rendering:pixelated}.c b{display:block;font-family:'Press Start 2P',monospace;font-size:11px;color:#ffd166;margin:6px 0}.c s{color:#888;font-size:11px}.c small{font-size:11px;color:#9fe8ff}</style></head>
<body><h2 style="font-family:'Press Start 2P',monospace">New names from block <span id="g"></span></h2><p class="small muted">Same egg, same pet. Only the name is new. Old name shown crossed out for comparison (old pets keep theirs).</p><div class="g" id="o"></div>
<script src="../../js/pet-core.js"></script><script>
var P=window.PetCore||window.XCPetCore||window.PET_CORE;for(var k in window)if(window[k]&&window[k].uniqueName&&window[k].generate)P=window[k];
document.getElementById('g').textContent=P.ACTIVATE_UNIQUE_NAME_BLOCK.toLocaleString('en-US');
var o=document.getElementById('o');
for(var i=1;i<=12;i++){var h=P.sha256Hex('preview'+i),a=P.generate({blockHash:h,petId:5300+i,blockHeight:P.ACTIVATE_UNIQUE_NAME_BLOCK-1}),b=P.generate({blockHash:h,petId:5300+i,blockHeight:P.ACTIVATE_UNIQUE_NAME_BLOCK});
var img=P.render(b,{stage:3}),c=document.createElement('canvas');c.width=img.width;c.height=img.height;var x=c.getContext("2d"),id=x.createImageData(img.width,img.height);id.data.set(img.data);x.putImageData(id,0,0);
var d=document.createElement('div');d.className='c';d.appendChild(c);d.insertAdjacentHTML('beforeend','<b>'+b.defaultName+'</b><s>'+a.defaultName+'</s><br><small>'+b.tier+' · '+b.species+'</small>');o.appendChild(d);}
</script></body></html>
